# Narratron 本機基礎設施
# 對應白皮書資料層：State Vault / Cache / Vec
# 用法：cp .env.example .env && docker compose up -d
# 應用層預設 VAULT_BACKEND=memory；切 postgres 後才寫入此庫。

services:
  postgres:
    image: postgres:16-alpine
    container_name: narratron-state-vault
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-narratron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narratron}
      POSTGRES_DB: ${POSTGRES_DB:-narratron_vault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - narratron_pg:/var/lib/postgresql/data
      - ./docker/init-vault.sql:/docker-entrypoint-initdb.d/01-vault.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-narratron} -d ${POSTGRES_DB:-narratron_vault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: narratron-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: narratron-vec
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - narratron_chroma:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  narratron_pg:
  narratron_chroma:
